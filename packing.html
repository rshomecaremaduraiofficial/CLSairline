<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Packing Traceability — CLS Airline Supplies LTD</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/cls-logo.svg">
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="header-container">
      <a href="dashboard.html" class="brand-wrapper">
        <img src="assets/cls-logo.svg" alt="CLS Airline Supplies LTD" class="brand-logo-img">
        <div class="brand-info">
          <h1>CLS Airline Supplies</h1>
          <span>Traceability Operations</span>
        </div>
      </a>

      <div class="user-nav-section">
        <div class="user-status-pill">
          <div class="user-avatar" id="header-avatar">OP</div>
          <span class="user-fullname" id="header-username">Operator</span>
          <span class="area-badge" id="header-area">London</span>
        </div>
        <button id="btn-logout" class="btn-nav-logout" title="End Session">
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="page-title-bar">
      <div>
        <h2>Packing Process Traceability Log</h2>
        <p>Record airline flight meal sealing, tray counts, and pre-departure label QA verification.</p>
      </div>
      <a href="dashboard.html" class="btn-back-dashboard">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Back to Dashboard
      </a>
    </div>

    <div class="form-card">
      <form id="packing-form" autocomplete="off">
        <div class="form-grid-2">
          <div class="form-group">
            <label class="form-label" for="pack-date">Packing Date</label>
            <input type="date" id="pack-date" class="form-control" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="pack-batch">Production Batch ID</label>
            <input type="text" id="pack-batch" class="form-control" placeholder="e.g. CLS-000001 or 250926" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="flight-no">Flight / Service Order No.</label>
            <input type="text" id="flight-no" class="form-control" placeholder="e.g. BA-117 / VS-003" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="pack-count">Total Packed Trays / Meals</label>
            <input type="number" id="pack-count" class="form-control" placeholder="e.g. 280" required>
          </div>

          <div class="form-group">
            <label class="form-label">Packaging Integrity / Seal Check</label>
            <div class="choice-pill-group">
              <div class="choice-pill">
                <input type="radio" id="seal-pass" name="sealCheck" value="Pass" checked>
                <label for="seal-pass">Pass (100% Sealed)</label>
              </div>
              <div class="choice-pill danger">
                <input type="radio" id="seal-fail" name="sealCheck" value="Fail">
                <label for="seal-fail">Fail</label>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Flight Meal Label Verification</label>
            <div class="choice-pill-group">
              <div class="choice-pill">
                <input type="radio" id="lbl-pass" name="labelCheck" value="Pass" checked>
                <label for="lbl-pass">Pass (Allergens &amp; Date OK)</label>
              </div>
              <div class="choice-pill danger">
                <input type="radio" id="lbl-fail" name="labelCheck" value="Fail">
                <label for="lbl-fail">Fail</label>
              </div>
            </div>
          </div>

          <div class="form-group col-span-2">
            <label class="form-label" for="pack-operator">Packaging Lead / QC Inspector</label>
            <input type="text" id="pack-operator" class="form-control" required>
          </div>

          <div class="form-group col-span-2">
            <label class="form-label" for="pack-notes">Trolley / Container Seal Numbers &amp; Notes <span class="optional">Optional</span></label>
            <textarea id="pack-notes" class="form-control" placeholder="Loaded into High-Loader Cart #14, Cart Seal: CLS-SEC-9982"></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button type="reset" class="btn-secondary">Clear</button>
          <button type="submit" class="btn-primary" id="btn-pack-submit">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            <span id="btn-pack-text">Confirm Packing Dispatch Log</span>
          </button>
        </div>
      </form>
    </div>
  </main>

  <script src="js/api-config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const session = CLS_Auth.requireAuth();
      if (!session) return;

      const dateInput = document.getElementById('pack-date');
      dateInput.value = CLS_Common.formatDateForInput();

      document.getElementById('pack-operator').value = session.user.fullName || session.user.username;

      document.getElementById('btn-logout').addEventListener('click', (e) => {
        e.preventDefault();
        CLS_Auth.logout();
      });

      const form = document.getElementById('packing-form');
      const submitBtn = document.getElementById('btn-pack-submit');
      const submitBtnText = document.getElementById('btn-pack-text');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const record = {
          date: dateInput.value,
          batchId: document.getElementById('pack-batch').value.trim(),
          flightOrderNo: document.getElementById('flight-no').value.trim(),
          packCount: document.getElementById('pack-count').value,
          sealCheck: document.querySelector('input[name="sealCheck"]:checked').value,
          labelCheck: document.querySelector('input[name="labelCheck"]:checked').value,
          operator: document.getElementById('pack-operator').value.trim(),
          notes: document.getElementById('pack-notes').value.trim()
        };

        submitBtn.disabled = true;
        submitBtnText.textContent = 'Saving...';
        CLS_Common.showLoader('Recording Packing Batch', 'Logging airline catering dispatch');

        try {
          const res = await CLS_API.execute('savePacking', { record });
          CLS_Common.hideLoader();
          if (res && res.success) {
            CLS_Common.showToast(`Packing record ${res.recordId} logged successfully!`, 'success');
            form.reset();
            dateInput.value = CLS_Common.formatDateForInput();
            document.getElementById('pack-operator').value = session.user.fullName || session.user.username;
          }
        } catch (err) {
          CLS_Common.hideLoader();
          CLS_Common.showToast('Failed to save packing record.', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtnText.textContent = 'Confirm Packing Dispatch Log';
        }
      });
    });
  </script>
</body>
</html>
